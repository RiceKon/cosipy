author: Hiroki Yoneda 
date: 2024-06-12
model_definition:
  class: "AllSkyImage"
  property:
    coordinate: "galactic"
    nside: 16
    scheme: "ring"
    energy_edges: # shoud be the same as the response matrix
      value: [1329., 1336.]
      unit: "keV"
    unit: "cm-2 s-1 sr-1" # do not change it as for now
  initialization:
    algorithm: "flat" # more methods, e.g., simple-backprojection, user-defined, would be implemented.
    parameter:
      value: [1e-4] #the number of these values should be the same as "the number of energy_edges - 1".
      unit: "cm-2 s-1 sr-1"  # do not change it as for now
deconvolution:
# if fails use "RLsimple"
  algorithm: "RL"
  parameter:
  # 10 min
    iteration_max: 2
    acceleration: True
    alpha_max: 10.0
    response_weighting: True
    response_weighting_index: 0.5
    smoothing: True
    smoothing_FWHM:
        value: 2.0
        unit: "deg"
    stopping_criteria:
        statistics: "log-likelihood"
        threshold: 0.01
    background_normalization_optimization: True
    background_normalization_optimization_range: {"albedo": [0.01, 10.0]}
    save_results: False
    save_results_directory: "./results"
    save_results_only_final_result: True
